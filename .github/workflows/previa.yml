name: Prévia da proposta

# Publica cada proposta (pull request) num endereço temporário do Firebase, que vale 7 dias.
# A prévia abre sempre no modo demonstração (clientes fictícias): não lê nem grava os dados reais.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: previa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  previa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar a prévia
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          npx --yes firebase-tools@13.29.1 hosting:channel:deploy "pr${{ github.event.pull_request.number }}" --expires 7d --project "$P" --json > "$RUNNER_TEMP/previa.json"
          URL=$(jq -r '.result[]?.url // empty' "$RUNNER_TEMP/previa.json" | head -1)
          [ -n "$URL" ] || { cat "$RUNNER_TEMP/previa.json"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=Prévia::$URL"

      - name: Publicar a prévia do estúdio da Raquel
        # Mesmo sistema, montado com negocios/raquel. Também abre só no modo demonstração.
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          node integracao/montar.mjs raquel site-raquel
          jq '.hosting.public = "site-raquel" | del(.firestore)' firebase.json > firebase-raquel.json
          npx --yes firebase-tools@13.29.1 hosting:channel:deploy "pr${{ github.event.pull_request.number }}-raquel" --config firebase-raquel.json --expires 7d --project "$P" --json > "$RUNNER_TEMP/previa-raquel.json"
          URL2=$(jq -r '.result[]?.url // empty' "$RUNNER_TEMP/previa-raquel.json" | head -1)
          [ -n "$URL2" ] || { cat "$RUNNER_TEMP/previa-raquel.json"; exit 1; }
          echo "URL_RAQUEL=$URL2" >> "$GITHUB_ENV"
          echo "::notice title=Prévia da Raquel::$URL2"

      - name: Publicar a prévia da barbearia Mederin do Corte
        # Mesmo sistema, montado com negocios/mederin. Também abre só no modo demonstração.
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          P=$(jq -r .project_id "$RUNNER_TEMP/sa.json")
          node integracao/montar.mjs mederin site-mederin
          jq '.hosting.public = "site-mederin" | del(.firestore)' firebase.json > firebase-mederin.json
          npx --yes firebase-tools@13.29.1 hosting:channel:deploy "pr${{ github.event.pull_request.number }}-mederin" --config firebase-mederin.json --expires 7d --project "$P" --json > "$RUNNER_TEMP/previa-mederin.json"
          URL3=$(jq -r '.result[]?.url // empty' "$RUNNER_TEMP/previa-mederin.json" | head -1)
          [ -n "$URL3" ] || { cat "$RUNNER_TEMP/previa-mederin.json"; exit 1; }
          echo "URL_MEDERIN=$URL3" >> "$GITHUB_ENV"
          echo "::notice title=Prévia da Mederin do Corte::$URL3"

      - name: Avisar na proposta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corpo="**Prévia desta proposta:** $URL${URL_RAQUEL:+

          **Prévia do estúdio da Raquel:** $URL_RAQUEL}${URL_MEDERIN:+

          **Prévia da barbearia Mederin do Corte:** $URL_MEDERIN}

          Abre sempre no modo demonstração, com clientes fictícias. Vale 7 dias e é atualizada a cada mudança na proposta."
          ja=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '[.[] | select(.body | startswith("**Prévia desta proposta:**"))][0].id // empty')
          if [ -n "$ja" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ja" -f body="$corpo" >/dev/null
          else gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$corpo" >/dev/null; fi
