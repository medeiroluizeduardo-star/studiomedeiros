name: Publicar no Firebase

# Publica o site e as regras de segurança. Antes, roda os testes automáticos: se algum falhar, nada é publicado.
# Trava da main: só publica o que entrou por proposta (pull request) aceita. Um envio direto para a main
# (ou "Add files via upload" pelo site do GitHub) é barrado e o site continua como estava.
# Em emergência dá para publicar à mão pelo botão "Run workflow", que não passa pela trava.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  origem:
    name: Conferir se veio de proposta aceita
    runs-on: ubuntu-latest
    steps:
      - name: Conferir origem do envio
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "::notice::Publicação manual (Run workflow): a trava de proposta não se aplica."
            exit 0
          fi
          # O GitHub às vezes leva alguns segundos para ligar o commit à proposta: tenta algumas vezes.
          for tentativa in 1 2 3 4; do
            QTD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length') || QTD=0
            if [ "${QTD:-0}" -gt 0 ]; then
              echo "O commit $GITHUB_SHA veio de proposta aceita. Pode publicar."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Envio direto para a main, sem proposta (pull request) aceita: o site NÃO foi publicado e continua como estava. Faça a mudança por proposta. Em emergência, use o botão Run workflow desta rotina."
          exit 1

  testes:
    needs: origem
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: [origem, testes]
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar chave do Firebase
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Falta cadastrar o segredo FIREBASE_SERVICE_ACCOUNT em Settings > Secrets and variables > Actions."
      - name: Compactar arquivos para abrir mais rápido
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/min"
          for f in app.js publico.js catalogo.js cliente.js contrato.js cadastro.js styles.css publico.css; do
            npx -y esbuild@0.23.1 "public/$f" --minify --log-level=warning --outfile="$RUNNER_TEMP/min/$f"
          done
          for f in app.js publico.js catalogo.js cliente.js contrato.js cadastro.js styles.css publico.css; do
            test -s "$RUNNER_TEMP/min/$f"
          done
          cp "$RUNNER_TEMP"/min/* public/
          echo "Arquivos compactados:"; ls -la public/*.js public/*.css
      - name: Marcar versão nos arquivos (evita visual antigo no celular)
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i -E "s#(href|src)=\"(/?)(styles|publico|app|catalogo|cliente|contrato|cadastro)\.(css|js)\"#\1=\"\2\3.\4?v=$V\"#g" public/*.html
          grep -ho 'v=[0-9a-f]*' public/*.html | sort | uniq -c
      - name: Publicar site no Firebase Hosting
        if: env.FIREBASE_SA != ''
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          npx -y firebase-tools@13.29.1 deploy --only hosting --project stefany-medeiros-trancista --non-interactive 2>&1 | tee deploy.log
      - name: Publicar regras de segurança do Firestore
        id: regras
        if: env.FIREBASE_SA != ''
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          npx -y firebase-tools@13.29.1 deploy --only firestore:rules --project stefany-medeiros-trancista --non-interactive 2>&1 | tee regras.log
      - name: Avisar se as regras não foram publicadas
        if: steps.regras.outcome == 'failure'
        run: |
          msg=$( (tail -n 20 regras.log 2>/dev/null; tail -n 20 firebase-debug.log 2>/dev/null) | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Regras não publicadas (falta permissão?)::$msg"
      - name: Mostrar o motivo da falha
        if: failure()
        run: |
          msg=$( (tail -n 25 deploy.log 2>/dev/null; tail -n 25 firebase-debug.log 2>/dev/null) | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Falha na publicação::$msg"
