name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar chave do Firebase
        if: env.FIREBASE_SA == ''
        run: echo "::warning::Falta cadastrar o segredo FIREBASE_SERVICE_ACCOUNT em Settings > Secrets and variables > Actions."
      - name: Compactar arquivos para abrir mais rápido
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/min"
          for f in app.js publico.js catalogo.js cliente.js contrato.js cadastro.js styles.css publico.css; do
            npx -y esbuild@0.23.1 "public/$f" --minify --log-level=warning --outfile="$RUNNER_TEMP/min/$f"
          done
          for f in app.js publico.js catalogo.js cliente.js contrato.js cadastro.js styles.css publico.css; do
            test -s "$RUNNER_TEMP/min/$f"
          done
          cp "$RUNNER_TEMP"/min/* public/
          echo "Arquivos compactados:"; ls -la public/*.js public/*.css
      - name: Publicar site no Firebase Hosting
        if: env.FIREBASE_SA != ''
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          npx -y firebase-tools@13.29.1 deploy --only hosting --project stefany-medeiros-trancista --non-interactive 2>&1 | tee deploy.log
      - name: Publicar regras de segurança do Firestore
        id: regras
        if: env.FIREBASE_SA != ''
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          npx -y firebase-tools@13.29.1 deploy --only firestore:rules --project stefany-medeiros-trancista --non-interactive 2>&1 | tee regras.log
      - name: Avisar se as regras não foram publicadas
        if: steps.regras.outcome == 'failure'
        run: |
          msg=$( (tail -n 20 regras.log 2>/dev/null; tail -n 20 firebase-debug.log 2>/dev/null) | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=Regras não publicadas (falta permissão?)::$msg"
      - name: Mostrar o motivo da falha
        if: failure()
        run: |
          msg=$( (tail -n 25 deploy.log 2>/dev/null; tail -n 25 firebase-debug.log 2>/dev/null) | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Falha na publicação::$msg"
